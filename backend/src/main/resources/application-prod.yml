# 운영용: PostgreSQL. 접속 정보는 환경변수로만 받는다 (값을 이 파일에 쓰지 말 것).
server:
  # 호스팅 플랫폼(Render 등)이 넘기는 포트를 쓴다. 없으면 8080.
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # 스키마는 Flyway 가 db/migration 의 SQL 로 만든다. clean 은 Spring Boot 기본값(금지)을 유지한다.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      # 운영에서는 스키마를 자동 변경하지 않고, 엔티티와 일치하는지 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        # Instant 를 UTC 로 저장/조회한다. DB 세션 시간대에 영향받지 않게 한다.
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

jwt:
  # 반드시 환경변수로 주입. 없으면 앱이 기동되지 않는다. (32바이트 이상)
  secret: ${JWT_SECRET:}
