# 공통 설정 (모든 프로필에 적용)
spring:
  application:
    name: kotoba-backend
  profiles:
    # 프로필을 지정하지 않으면 dev 로 실행된다. 운영은 SPRING_PROFILES_ACTIVE=prod 로 명시.
    default: dev
  autoconfigure:
    # JWT 로만 인증하므로 Boot 가 만드는 기본 인메모리 계정(로그에 임시 비밀번호 출력)을 끈다.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    # 뷰 렌더링 시점까지 DB 커넥션을 붙잡지 않도록 끈다 (REST API 에서는 불필요).
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        # size 를 이보다 크게 요청해도 이 값으로 잘린다 (에러 아님).
        max-page-size: 100

jwt:
  # 기본은 빈 값. 비어 있으면 JwtProperties 검증에서 기동이 실패한다 (dev 만 기본값을 덮어씀).
  secret: ${JWT_SECRET:}
  issuer: kotoba
  access-token-ttl: 30m
  refresh-token-ttl: 14d

app:
  study:
    # "오늘", 연속 학습일, 날짜별 통계, 다음 복습 시각의 날짜 경계 기준
    zone: Asia/Seoul
    # 회원당(모든 덱 합산) 하루 신규 카드 수
    daily-new-card-limit: 20

management:
  endpoints:
    web:
      exposure:
        include: health
