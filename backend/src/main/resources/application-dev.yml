# 개발용: H2 인메모리 DB (PostgreSQL 호환 모드). 앱을 재시작하면 데이터가 초기화된다.
spring:
  datasource:
    url: jdbc:h2:mem:kotoba;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  # dev(H2)는 Hibernate 가 엔티티로 스키마를 만든다. 마이그레이션 SQL 은 PostgreSQL 문법이라 H2 에서 실행하지 않는다.
  # 엔티티와 마이그레이션의 일치는 CI 의 postgres 작업(pgtest 프로필)이 검증한다.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # dev 전용 기본값. 운영에서는 절대 쓰지 않는다 (prod 는 JWT_SECRET 필수).
  secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
