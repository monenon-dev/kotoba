# CI: 빌드와 전체 테스트를 H2 와 PostgreSQL 에서 각각 실행한다.
# 설계: docs/design/05-ci-postgres.md
#
# 비밀값을 쓰지 않는다. 아래 env 의 값은 모두 CI 서비스 컨테이너와 테스트 안에서만 쓰는 가짜 값이다.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 최소 권한: 코드 읽기만 한다. (아티팩트 업로드에는 추가 권한이 필요 없다)
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # 빠른 피드백: 로컬과 같은 H2(dev 프로필)로 빌드와 전체 테스트
  h2:
    name: build & test (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성/wrapper 캐시와 gradle-wrapper.jar 검증
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-h2
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

  # 운영과 같은 조건: PostgreSQL + Flyway 마이그레이션 + Hibernate validate (pgtest 프로필)
  # 엔티티와 마이그레이션이 어긋나면 컨텍스트 기동 또는 SchemaConsistencyTest 가 실패한다.
  postgres:
    name: test (PostgreSQL + Flyway)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kotoba_ci
          POSTGRES_USER: kotoba_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotoba_ci -d kotoba_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB: postgres
      DB_URL: jdbc:postgresql://localhost:5432/kotoba_ci
      DB_USERNAME: kotoba_ci
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-fake-jwt-secret-not-used-anywhere-0123456789
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test against PostgreSQL
        run: ./gradlew test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-postgres
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore
