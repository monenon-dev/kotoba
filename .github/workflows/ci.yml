# CI: 빌드와 전체 테스트를 H2 와 PostgreSQL 에서 각각 실행한다.
# 설계: docs/design/05-ci-postgres.md
#
# 비밀값을 쓰지 않는다. 아래 env 의 값은 모두 CI 서비스 컨테이너와 테스트 안에서만 쓰는 가짜 값이다.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# 최소 권한: 코드 읽기만 한다. (아티팩트 업로드에는 추가 권한이 필요 없다)
permissions:
  contents: read

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  # 빠른 피드백: 로컬과 같은 H2(dev 프로필)로 빌드와 전체 테스트
  h2:
    name: build & test (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성/wrapper 캐시와 gradle-wrapper.jar 검증
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-h2
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

  # 운영과 같은 조건: PostgreSQL + Flyway 마이그레이션 + Hibernate validate (pgtest 프로필)
  # 엔티티와 마이그레이션이 어긋나면 컨텍스트 기동 또는 SchemaConsistencyTest 가 실패한다.
  postgres:
    name: test (PostgreSQL + Flyway)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kotoba_ci
          POSTGRES_USER: kotoba_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotoba_ci -d kotoba_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB: postgres
      DB_URL: jdbc:postgresql://localhost:5432/kotoba_ci
      DB_USERNAME: kotoba_ci
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-fake-jwt-secret-not-used-anywhere-0123456789
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Test against PostgreSQL
        run: ./gradlew test --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-postgres
          path: |
            backend/build/reports/tests/test
            backend/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore

  # 이미지를 빌드해 실제로 띄워 본다. 레지스트리에 푸시하거나 배포하지 않는다.
  # 설계: docs/design/06-deploy.md
  container:
    name: container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
        shell: bash
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kotoba_smoke
          POSTGRES_USER: kotoba_smoke
          POSTGRES_PASSWORD: ci-only-password
        # ports 를 쓰지 않는다. 앱 컨테이너를 같은 네트워크에 붙여 접속한다.
        options: >-
          --health-cmd "pg_isready -U kotoba_smoke -d kotoba_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      IMAGE: kotoba-backend:${{ github.sha }}
      DB_URL: jdbc:postgresql://postgres:5432/kotoba_smoke
      DB_USERNAME: kotoba_smoke
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-fake-jwt-secret-not-used-anywhere-0123456789
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" backend

      - name: Check image is non-root and has a healthcheck
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE" -u)
          echo "uid=$uid"
          test "$uid" != "0"
          healthcheck=$(docker inspect -f '{{json .Config.Healthcheck}}' "$IMAGE")
          echo "healthcheck: $healthcheck"
          [[ "$healthcheck" == *"/api/health"* ]]

      # 프로필을 주지 않아 이미지 기본값(prod)으로 뜨는 경로를 검사한다.
      - name: Check app starts and reports UP
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run -d --name kotoba-app --network "$NETWORK" -p 127.0.0.1:8080:8080 \
            -e DB_URL -e DB_USERNAME -e DB_PASSWORD -e JWT_SECRET "$IMAGE"
          status=starting
          for _ in $(seq 1 48); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kotoba-app)
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          echo "docker health: $status"
          test "$status" = "healthy"
          curl -fsS http://127.0.0.1:8080/api/health | jq -e '.status == "UP"'
          # /api/health 는 DB 를 보지 않으므로 actuator 로 DB 연결까지 확인한다.
          curl -fsS http://127.0.0.1:8080/actuator/health | jq -e '.status == "UP"'
          # grep -q 는 찾자마자 끝나서 pipefail 에서 SIGPIPE(141)로 실패할 수 있어 변수로 받는다.
          logs=$(docker logs kotoba-app 2>&1)
          [[ "$logs" == *'The following 1 profile is active: "prod"'* ]]

      # Render 처럼 PORT 를 넘겼을 때 앱과 HEALTHCHECK 가 모두 그 포트를 쓰는지 검사한다.
      - name: Check app honors PORT
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run -d --name kotoba-port --network "$NETWORK" -p 127.0.0.1:10000:10000 \
            -e PORT=10000 -e DB_URL -e DB_USERNAME -e DB_PASSWORD -e JWT_SECRET "$IMAGE"
          status=starting
          for _ in $(seq 1 48); do
            status=$(docker inspect -f '{{.State.Health.Status}}' kotoba-port)
            if [ "$status" = "healthy" ] || [ "$status" = "unhealthy" ]; then break; fi
            sleep 5
          done
          echo "docker health: $status"
          test "$status" = "healthy"
          curl -fsS http://127.0.0.1:10000/api/health | jq -e '.status == "UP"'
          logs=$(docker logs kotoba-port 2>&1)
          [[ "$logs" == *'Tomcat started on port 10000'* ]]
          docker rm -f kotoba-port

      # DB 설정은 정상으로 두고 JWT_SECRET 만 뺀다. 프로필도 주지 않는다.
      # 로그까지 보는 이유: 종료 코드만 보면 다른 이유로 죽어도 통과한다.
      - name: Check app refuses to start without JWT_SECRET
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: |
          docker run -d --name kotoba-no-jwt --network "$NETWORK" \
            -e DB_URL -e DB_USERNAME -e DB_PASSWORD "$IMAGE"
          if ! code=$(timeout 120 docker wait kotoba-no-jwt); then
            echo "::error::JWT_SECRET 없이 120초 안에 종료되지 않았습니다."
            exit 1
          fi
          echo "exit code: $code"
          test "$code" != "0"
          logs=$(docker logs kotoba-no-jwt 2>&1)
          [[ "$logs" == *JWT_SECRET* ]]

      # .env.example 을 그대로 복사해 쓰므로 예시 파일과 Compose 가 어긋나도 실패한다.
      - name: Check docker compose
        run: |
          docker rm -f kotoba-app
          cp .env.example .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$DB_PASSWORD/; s/^JWT_SECRET=.*/JWT_SECRET=$JWT_SECRET/" .env
          docker compose up -d --build --wait --wait-timeout 240

          db=$(docker compose ps -q db)
          bindings=$(docker inspect -f '{{json .HostConfig.PortBindings}}' "$db")
          echo "db port bindings: $bindings"
          if [[ "$bindings" == *HostPort* ]]; then
            echo "::error::DB 포트가 외부에 노출되어 있습니다."
            exit 1
          fi
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$db")" = "unless-stopped"
          test "$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$(docker compose ps -q app)")" = "unless-stopped"

          # 컨테이너를 지웠다가 다시 만들어도 볼륨의 데이터가 남는지 확인한다.
          body='{"email":"smoke@example.com","password":"ci-only-password"}'
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/auth/signup
          docker compose down
          docker compose up -d --wait --wait-timeout 240
          curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/auth/login

      # 위 Compose 앱을 대상으로 시드 스크립트를 두 번 실행한다. 두 번째는 아무것도 만들지 않아야 한다.
      - name: Check demo seed script
        env:
          KOTOBA_SEED_PASSWORD: ci-only-password
        run: |
          seed() { pwsh -NoProfile -File scripts/seed-demo.ps1 -BaseUrl http://127.0.0.1:8080 -Email seed@example.com; }
          count=$(jq '.cards | length' scripts/seed-demo-data.json)
          first=$(seed)
          echo "$first"
          [[ "$first" == *"created=$count"* ]]
          second=$(seed)
          echo "$second"
          [[ "$second" == *"created=0"* ]]

          # 일본어가 깨지지 않고 저장됐는지 API 응답과 원본 데이터를 비교한다.
          body="{\"email\":\"seed@example.com\",\"password\":\"$KOTOBA_SEED_PASSWORD\"}"
          token=$(curl -fsS -X POST -H 'Content-Type: application/json' -d "$body" http://127.0.0.1:8080/api/auth/login | jq -r .accessToken)
          deck=$(curl -fsS -H "Authorization: Bearer $token" 'http://127.0.0.1:8080/api/decks?size=100' | jq '.content[0].id')
          diff <(jq -S '[.cards[].text] | sort' scripts/seed-demo-data.json) \
            <(curl -fsS -H "Authorization: Bearer $token" "http://127.0.0.1:8080/api/decks/$deck/cards?size=100" | jq -S '[.content[].text] | sort')

      - name: Show container logs
        if: always()
        run: |
          for name in kotoba-app kotoba-port kotoba-no-jwt; do
            echo "::group::$name"
            docker logs "$name" 2>&1 || true
            echo "::endgroup::"
          done
          echo "::group::compose"
          docker compose logs --no-color 2>&1 || true
          echo "::endgroup::"
