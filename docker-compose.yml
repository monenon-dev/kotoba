# 앱 + PostgreSQL 을 prod 프로필로 실행한다. 설계: docs/design/06-deploy.md
# 비밀값은 커밋되지 않는 .env 에서 읽는다 (.env.example 을 복사해서 값을 바꿀 것).
name: kotoba

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME 을 .env 에 설정하세요}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME 을 .env 에 설정하세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    # ports 를 쓰지 않는다. DB 는 Compose 내부 네트워크에서만 접속할 수 있다.

  app:
    build: ./backend
    image: kotoba-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 설정하세요}
    ports:
      # TLS 가 없으므로 이 컴퓨터에서만 접속할 수 있게 한다.
      - "127.0.0.1:8080:8080"

volumes:
  db-data:
